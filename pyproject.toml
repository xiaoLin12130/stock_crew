[project]
name = "stock-review-crew"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.64",
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "langchain>=1.3.13",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.3.5",
    "langfuse>=4.14.2",
    "langgraph>=1.2.9",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.2",
    "streamlit>=1.59.1",
    "tushare>=1.4.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_review_crew"]
